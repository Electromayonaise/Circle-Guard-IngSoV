apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data-pvc
  namespace: sonarqube
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarqube
  template:
    metadata:
      labels:
        app: sonarqube
    spec:
      tolerations:
        - key: "dedicated"
          operator: "Equal"
          value: "jenkins"
          effect: "NoSchedule"
      nodeSelector:
        dedicated: "jenkins"
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-sysctl
          image: busybox:1.36
          securityContext:
            privileged: true
          command: ['sh', '-c', 'sysctl -w vm.max_map_count=524288 && sysctl -w fs.file-max=131072']
        - name: init-chown
          image: busybox:1.36
          securityContext:
            runAsUser: 0
          command: ['sh', '-c', 'chown -R 1000:1000 /opt/sonarqube/data']
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
      containers:
        - name: sonarqube
          image: sonarqube:10.4-community
          env:
            - name: SONAR_JDBC_URL
              value: "jdbc:postgresql://sonarqube-postgres.sonarqube.svc.cluster.local:5432/sonar"
            - name: SONAR_JDBC_USERNAME
              valueFrom:
                secretKeyRef:
                  name: sonarqube-postgres-secret
                  key: POSTGRES_USER
            - name: SONAR_JDBC_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sonarqube-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: SONAR_WEB_JAVAOPTS
              value: "-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError"
            - name: SONAR_CE_JAVAOPTS
              value: "-Xmx512m -Xms256m -XX:+HeapDumpOnOutOfMemoryError"
            - name: SONAR_SEARCH_JAVAOPTS
              value: "-Xmx512m -Xms512m -Xss1m"
          ports:
            - containerPort: 9000
          volumeMounts:
            - name: data
              mountPath: /opt/sonarqube/data
          readinessProbe:
            httpGet:
              path: /api/system/status
              port: 9000
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 20
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sonarqube-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: sonarqube
spec:
  type: ClusterIP
  selector:
    app: sonarqube
  ports:
    - port: 9000
      targetPort: 9000
