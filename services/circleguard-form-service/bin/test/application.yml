spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true

storage:
  upload-dir: ${java.io.tmpdir}/circleguard-test-uploads

cors:
  allowed-origins: https://gateway-dev.circleguard.local,https://gateway-stage.circleguard.local,https://gateway-master.circleguard.local
