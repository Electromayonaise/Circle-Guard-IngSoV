spring:
  application:
    name: circleguard-dashboard-service
  datasource:
    url: jdbc:postgresql://localhost:5432/circleguard_dashboard
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8084

analytics:
  enabled: ${ANALYTICS_ENABLED:true}

cors:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:8081,http://localhost:8080}
